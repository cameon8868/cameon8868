name: Codeforces card

on:
  schedule:
    - cron: "0 3 * * *"   # раз в день
  workflow_dispatch:       # ручной запуск

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate card
        run: python scripts/codeforces_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet && exit 0
          git commit -m "Update Codeforces card"
          git push
