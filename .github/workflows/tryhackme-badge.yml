name: Update TryHackMe card

on:
  schedule:
    - cron: '0 0 * * *'   # раз в сутки
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download profile card
        run: |
          mkdir -p assets
          URL=$(curl -sL -A "Mozilla/5.0" "https://tryhackme.com/p/cammeonn" \
            | grep -oE 'https://cdn-images\.tryhackme\.com/public-profile/cammeonn/[A-Za-z0-9]+\.png' \
            | head -n1)
          echo "Card URL: $URL"
          test -n "$URL"
          curl -sL "$URL" -o assets/tryhackme-card.png

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme-card.png
          git diff --staged --quiet && exit 0
          git commit -m "Update TryHackMe card"
          git push
