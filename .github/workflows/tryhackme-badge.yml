name: Update TryHackMe card

on:
  schedule:
    - cron: '0 0 * * *'   # раз в сутки
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download profile card
        run: |
          mkdir -p assets
          URL=$(curl -sL -A "Mozilla/5.0" "https://tryhackme.com/p/cammeonn" \
            | grep -oE 'https://cdn-images\.tryhackme\.com/public-profile/cammeonn/[A-Za-z0-9]+\.png' \
            | head -n1)
          echo "Card URL: $URL"
          test -n "$URL"
          curl -sL "$URL" -o assets/tryhackme-card.png

      - name: Download profile card
        run: |
          mkdir -p assets
          curl -sL -A "Mozilla/5.0" -o page.html -w "HTTP %{http_code}\n" "https://tryhackme.com/p/cammeonn"
          echo "Page size: $(wc -c < page.html) bytes"
          head -c 400 page.html
          echo
          URL=$(grep -oE 'https://cdn-images\.tryhackme\.com/public-profile/cammeonn/[A-Za-z0-9]+\.png' page.html | head -n1 || true)
          echo "Card URL: $URL"
          test -n "$URL"
          curl -sL "$URL" -o assets/tryhackme-card.png
